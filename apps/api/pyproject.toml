[project]
name = "freelancer-os-api"
version = "0.0.0"
description = "Freelancer OS API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "argon2-cffi>=25.1.0",
  "email-validator>=2.3.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is enforced by `ruff format`; long comments/strings are tolerated.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a reachable PostgreSQL (TEST_DATABASE_URL)"]
